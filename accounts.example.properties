# Copy to accounts.properties (git-ignored) and fill in what you have; see ACCOUNTS.md.
# Everything here is built into the APK, so none of it may be a real secret.

# Your public droid_codology server (server/droidcodology_server.py). Users can still change it.
# With it, "Sign in with Email / Google / Apple / GitHub" work out of the box.
defaultServer=

# Google sign-in without a server (settings sync to the user's Google Drive, hidden app folder).
# Google Cloud Console -> APIs & Services -> Credentials -> OAuth client ID -> "Desktop app".
# Google documents a Desktop client's secret as not confidential; it is still required.
googleClientId=
googleClientSecret=

# Google sign-in by code on another device, for Android 4.x whose browsers can't open Google's
# sign-in page any more: an OAuth client ID of type "TVs and Limited Input devices".
googleDeviceClientId=
googleDeviceClientSecret=

# GitHub sign-in by code (github.com/login/device) instead of a pasted token: the client ID of a
# GitHub OAuth app with "Enable Device Flow" ticked. No secret is needed. Without it, GitHub
# sign-in still works with a personal access token.
githubClientId=

# Email and password accounts without a server, through Firebase (Authentication with the
# Email/Password provider + Realtime Database). Project settings -> Web API key; the database URL
# looks like https://<project>-default-rtdb.<region>.firebasedatabase.app
firebaseApiKey=
firebaseDatabaseUrl=
